spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,http://localhost:8081}

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
  packages-to-scan: com.example.devflow.controller
